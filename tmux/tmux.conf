# tmux/tmux.conf
# @author deng
# since 2024 2025 2026

# === Core ===

# Keep terminal/update options idempotent so repeated `prefix R` reloads do not
# append duplicate feature or environment entries.
set -g default-terminal "tmux-256color"
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-256color:RGB,xterm-ghostty:RGB"
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY TERM TERM_PROGRAM"

# passthrough supports terminal image protocols used by tools like Yazi; focus
# and extended keys improve modern terminal/Neovim behavior inside tmux.
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g extended-keys on

# Keep custom key bindings in the small reset file so behavior and styling stay
# separate.
source-file ~/.config/tmux/tmux.reset.conf

set -g prefix ^`
set -sg repeat-time 0 # more responsive pane switching

set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1
set -g renumber-windows on       # renumber all windows when any window is closed
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format '#{pane_title}'

set -g escape-time 0             # zero-out escape time delay
setw -g mode-keys vi
set -g history-limit 10000
set -g cursor-style bar
set -g mouse on

# Show the tmux 3.6 scrollbar only in copy/view mode, avoiding permanent pane
# width changes during normal work.
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style 'fg=#585b70,bg=default'

# === Status ===

set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style bg=default,fg='#cdd6f4'

# Centralize status icons so Nerd Font glyph swaps stay local and semantic.
set -g @icon_session ''
set -g @icon_path ''
set -g @icon_cpu 'CPU'
set -g @icon_ram 'RAM'
set -g @icon_gpu '󰢮'
set -g @icon_host '󰒋'
set -g @icon_zoom ''
set -g @icon_window_overflow '󰽾'
set -g @icon_window_overflow_current '󰽽'

set -g status-left '#[fg=#f5c2e7]#[fg=#1e1e2e,bg=#f5c2e7]#{@icon_session} #S#[fg=#f5c2e7,bg=default]#[default] #[fg=white]| '

# Use tmux formats instead of shell commands here; the status line refreshes
# often, so avoiding `#(...)` keeps it cheap and shell-safe.
set -g status-right-length 150
set -g status-right '#{@icon_path}#[fg=white] #{b:pane_current_path} |#{cpu_fg_color} #{@icon_cpu}:#{cpu_percentage} #{ram_fg_color} #{@icon_ram}:#{ram_percentage}#{?#{==:#{gpu_percentage},No GPU},, #{gpu_fg_color} #{@icon_gpu} #{gpu_percentage}}#[default] | #{@icon_host} #{host_short}'

set -g window-status-style 'fg=#585b70'
set -g window-status-current-style 'fg=#f9e2af,bg=default'
set -g window-status-format '#{?#{==:#{window_index},1},󰎦 ,#{?#{==:#{window_index},2},󰎩 ,#{?#{==:#{window_index},3},󰎬 ,#{?#{==:#{window_index},4},󰎮 ,#{?#{==:#{window_index},5},󰎰 ,#{?#{==:#{window_index},6},󰎵 ,#{?#{==:#{window_index},7},󰎸 ,#{?#{==:#{window_index},8},󰎻 ,#{?#{==:#{window_index},9},󰎾 ,#{@icon_window_overflow} }}}}}}}}}#W#{?window_zoomed_flag, #{@icon_zoom} , }'
set -g window-status-current-format '#[fg=#89b4fa,bg=default]#[fg=#1e1e2e,bg=#89b4fa]#{?#{==:#{window_index},1},󰎤 ,#{?#{==:#{window_index},2},󰎧 ,#{?#{==:#{window_index},3},󰎪 ,#{?#{==:#{window_index},4},󰎭 ,#{?#{==:#{window_index},5},󰎱 ,#{?#{==:#{window_index},6},󰎳 ,#{?#{==:#{window_index},7},󰎶 ,#{?#{==:#{window_index},8},󰎹 ,#{?#{==:#{window_index},9},󰎼 ,#{@icon_window_overflow_current} }}}}}}}}}#{pane_title}#{?window_zoomed_flag, #{@icon_zoom},}#[fg=#89b4fa,bg=default]'

set -g copy-mode-match-style 'fg=#1e1e2e,bg=#cdd6f4'
set -g copy-mode-current-match-style 'fg=#1e1e2e,bg=#d20f39'

# set -g pane-border-lines simple
set -g pane-border-style 'fg=brightblack,bg=default'
set -g pane-active-border-style 'fg=#f5c2e7'

# === Plugins ===

# Pin TPM to the XDG tmux plugin directory instead of mixing ~/.tmux and
# ~/.config/tmux plugin locations.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# Companion config exists in tmux-nerd-font-window-name.yml if this is enabled.
# set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'

set -g @sessionx-bind 'o'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
# set -g @sessionx-custom-paths '/Users/dsh/.config,/Users/dsh/Documents/git-project'
set -g @sessionx-x-path '/Users/dsh/.config'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'

set -g @continuum-restore 'on'
set -g @fzf-url-history-limit '2000'

# Leave disabled unless Neovim session restore is intentionally managed through
# tmux-resurrect rather than the editor itself.
# set -g @resurrect-strategy-nvim 'session'

run '~/.config/tmux/plugins/tpm/tpm'
